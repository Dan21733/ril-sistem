<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · Operasional</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#23211e;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1d1a}
form{background:#fff;padding:26px 24px;border-radius:14px;width:min(340px,92vw);text-align:center}
h1{font-size:20px;margin:0 0 2px}p{color:#6b665d;margin:0 0 16px;font-size:14px}
.titik{display:flex;justify-content:center;gap:12px;margin:6px 0 18px}
.titik span{width:16px;height:16px;border-radius:50%;border:2px solid #cfcbc1}
.titik span.isi{background:#b4541f;border-color:#b4541f}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{font:inherit;font-size:24px;padding:14px 0;border:1px solid #e2dfd8;border-radius:12px;background:#f6f5f2;color:#1f1d1a;cursor:pointer}
.pad button:active{background:#f7e9df}
.pad .kecil{font-size:15px;color:#6b665d}
.galat{background:#f8e3e1;color:#a12b2b;padding:9px 11px;border-radius:8px;margin-bottom:12px;font-size:14px}
#pin{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.alat{font-size:12px;color:#8a857b;margin-top:16px}
</style></head><body>
<form method="post" id="f" autocomplete="off">{% csrf_token %}
  <h1>Masuk</h1><p>Dunia Bangunan · masukkan PIN kasirmu</p>
  {% if galat %}<div class="galat" role="alert">{{ galat }}</div>{% endif %}
  <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" aria-label="PIN 6 angka" autofocus>
  <div class="titik" aria-hidden="true">{% for _ in "123456" %}<span></span>{% endfor %}</div>
  <div class="pad">
    {% for n in "123456789" %}<button type="button" data-n="{{ n }}">{{ n }}</button>{% endfor %}
    <button type="button" data-hapus class="kecil">Hapus</button><button type="button" data-n="0">0</button><button type="submit" class="kecil">Masuk</button>
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  {% if perangkat %}<div class="alat">Perangkat: {{ perangkat.nama|default:perangkat.kode }}</div>{% endif %}
</form>
<script>
const pin = document.getElementById('pin'), titik = [...document.querySelectorAll('.titik span')], f = document.getElementById('f');
const gambar = () => titik.forEach((t, i) => t.classList.toggle('isi', i < pin.value.length));
const tambah = n => { if (pin.value.length < 6) { pin.value += n; gambar(); if (pin.value.length === 6) f.submit(); } };
document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => tambah(b.dataset.n)));
document.querySelector('[data-hapus]').addEventListener('click', () => { pin.value = pin.value.slice(0, -1); gambar(); });
document.addEventListener('keydown', e => {
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); tambah(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); pin.value = pin.value.slice(0, -1); gambar(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (pin.value.length === 6) f.submit(); }
});
</script>
</body></html>
