{% for r in daftar_rak %}<option value="{{ r.kode }}" data-r data-induk="{{ r.induk }}" data-baris="{% if r.baris %}{{ r.baris }}{% endif %}" data-kolom="{% if r.kolom %}{{ r.kolom }}{% endif %}" data-ruang="{% if r.ruang_id %}{{ r.ruang.nama }}{% endif %}" data-ruang-urut="{% if r.ruang_id %}{{ r.ruang.urutan }}{% endif %}" data-jenis="{{ r.jenis|default:'rak' }}" data-lebar="{{ r.lebar|default:1 }}" data-tinggi="{{ r.tinggi|default:1 }}" data-tempat="{% if r.tempat_id %}{{ r.tempat.nama }}{% endif %}" data-nama="{% if r.nama != r.kode %}{{ r.nama }}{% endif %}" data-pendek="{{ r.pendek }}" data-pendek-induk="{{ r.pendek_induk }}"{% if pilih and pilih == r.kode %} selected{% endif %}>rak {{ r.pendek }}{% if r.tempat_id %} · {{ r.tempat.nama }}{% endif %}</option>{% endfor %}
