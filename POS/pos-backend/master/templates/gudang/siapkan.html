{% extends "gudang/base.html" %}
{% block judul %}Siapkan barang{% endblock %}
{% block isi %}
<style>
.nota{background:var(--kartu);border:1px solid var(--garis);border-radius:12px;margin-bottom:12px;overflow:hidden}
.nota.punyaku{border-color:var(--aksen)}
.nota>.kepala{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--garis)}
.nota>.kepala b{font-size:16px}
.nota form{margin:0}
.klp{border-bottom:1px solid var(--garis)}.klp:last-child{border-bottom:0}
.klp .judul-klp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px 4px;font-weight:600}
.klp .brg{display:flex;gap:10px;justify-content:space-between;padding:4px 12px;font-size:14px}
.klp .brg .rak{color:var(--redup);font-size:13px;white-space:nowrap}
.klp .aksi{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px 12px}
.klp .aksi form{display:flex;gap:6px;align-items:center}
.klp .aksi select{width:auto;min-width:170px}
.tombol.rek{background:var(--aksen);border-color:var(--aksen);color:#fff;font-weight:600}
.status-klp{padding:8px 12px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg-saring{display:flex;gap:6px;margin-bottom:10px}.seg-saring a{flex:1;text-align:center}
.seg-saring a.aktif{background:var(--aksen);border-color:var(--aksen);color:#fff}
#dlgPin{border:1px solid var(--garis);border-radius:12px;background:var(--kartu);color:inherit;max-width:340px;width:92%}
#dlgPin input{font-size:22px;letter-spacing:6px;text-align:center}
.sibuk{opacity:.55;pointer-events:none}
</style>
<div class="judul-hal"><h2>Siapkan barang</h2><span class="redup kecil" id="jam">diperbarui {% now "H:i:s" %}</span></div>
<div id="daftar">{% include "gudang/_siapkan_daftar.html" %}</div>
<dialog id="dlgPin"><form method="dialog" id="formPin">
  <p id="pinJudul" style="margin:0 0 10px;font-weight:600"></p>
  <input type="password" id="pinIsi" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required aria-label="PIN">
  <p class="redup kecil" style="margin:8px 0 12px">Dicatat atas nama pemilik PIN.</p>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="tombol" type="button" id="pinBatal">Batal</button><button class="tombol utama" type="submit">OK</button></div>
</form></dialog>
<script>
// Tanpa muat ulang: aksi lewat fetch, daftar diganti tiap 12 detik (berhenti saat sedang memilih / isi PIN).
const daftar = document.getElementById('daftar'), dlg = document.getElementById('dlgPin'), isiPin = document.getElementById('pinIsi');
let disentuh = 0, formTunggu = null, sibuk = false;
['pointerdown', 'keydown', 'focusin'].forEach(e => document.addEventListener(e, () => disentuh = Date.now()));
function alamat(){ return location.pathname + location.search; }
async function segarkan(){
  if (sibuk) return;
  try {
    const r = await fetch(alamat(), {headers: {'X-Siapkan': '1'}, cache: 'no-store'});
    if (!r.ok) return;
    const buka = document.getElementById('selesai')?.open;
    daftar.innerHTML = (await r.json()).html;
    if (buka) document.getElementById('selesai').open = true;
    document.getElementById('jam').textContent = 'diperbarui ' + new Date().toLocaleTimeString('id-ID');
  } catch (e) { document.getElementById('jam').textContent = 'tidak tersambung, mencoba lagi…'; }
}
async function kirim(form, pin){
  const data = new FormData(form); if (pin) data.set('pin', pin);
  sibuk = true; form.closest('.nota')?.classList.add('sibuk');
  try {
    const r = await fetch(alamat(), {method: 'POST', body: data, headers: {'X-Siapkan': '1'}});
    const j = await r.json();
    if (j.pesan) kabar(j.pesan, !j.ok);
  } catch (e) { kabar('Tidak tersambung. Coba lagi.', true); }
  sibuk = false; await segarkan();
}
daftar.addEventListener('submit', e => {
  const f = e.target; e.preventDefault(); e.stopPropagation();
  if (f.dataset.pin){ formTunggu = f; document.getElementById('pinJudul').textContent = f.dataset.pin + ' — PIN:'; isiPin.value = ''; dlg.showModal(); isiPin.focus(); return; }
  kirim(f);
}, true);
document.getElementById('formPin').addEventListener('submit', () => { const f = formTunggu; formTunggu = null; if (f) kirim(f, isiPin.value); isiPin.value = ''; });
document.getElementById('pinBatal').onclick = () => { formTunggu = null; isiPin.value = ''; dlg.close(); };
daftar.addEventListener('click', e => { const a = e.target.closest('.seg-saring a'); if (!a) return; e.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); segarkan(); });
setInterval(() => { if (Date.now() - disentuh > 8000 && !dlg.open && document.activeElement.tagName !== 'SELECT') segarkan(); }, 12000);
</script>
{% endblock %}
