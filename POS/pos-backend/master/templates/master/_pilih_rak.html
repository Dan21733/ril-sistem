{% comment %}
Pemilih rak (13 Nov 2026). Mengganti <select data-pilih-rak> yang isinya rak dengan tombol + panel:
rak dikelompokkan per lokasi, lalu per kode dasar ("AT3-1-4" = kode dasar AT3-1, tingkat 4), satu baris per
kode dasar dengan tombol tingkat. Select aslinya tetap ada (tersembunyi) dan tetap yang dikirim/dibaca kode lain;
memilih di panel = mengisi select + memicu "change".
Opsi rak diberi data-r; opsi lain (kosong, "Semua", "Belum ada", "+ Rak baru…") tampil sebagai tombol di atas.
data-tempat = nama lokasi, data-nama = nama rak (keduanya boleh kosong).
Kode lain yang mengubah isi/nilai select lewat JS memanggil window.pilihRak.segarkan(select).
{% endcomment %}{% load master_tags %}{% denah_pemilih %}
<style>
.pr-tombol{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--garis-kuat);border-radius:8px;background:#fff;font:inherit;color:var(--teks);text-align:left;cursor:pointer}
.pr-tombol::after{content:"▾";color:var(--redup);font-size:12px}
.pr-tombol .pr-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .pr-tombol.sel{border-color:transparent;background:transparent;min-height:36px;padding:6px 8px}
tr:hover td .pr-tombol.sel,td .pr-tombol.sel:focus{border-color:var(--garis-kuat);background:#fff}
.pr-tombol.simpan{background:var(--baik-lembut)!important}.pr-tombol.gagal{background:var(--bahaya-lembut)!important;border-color:var(--bahaya)!important}
.pr-panel{position:absolute;z-index:60;width:min(560px,94vw);max-height:min(70vh,560px);overflow:auto;background:#fff;border:1px solid var(--garis-kuat);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:10px}
.pr-panel.lembar{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:78vh;border-radius:14px 14px 0 0;padding:12px 12px max(12px,env(safe-area-inset-bottom))}
.pr-latar{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.25)}
.pr-panel input.pr-cari{width:100%;min-height:42px;font-size:16px;margin:0 0 8px}
.pr-baris{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.pr-panel button{font:inherit;border:1px solid var(--garis-kuat);background:#fff;border-radius:8px;min-height:40px;min-width:44px;padding:6px 12px;cursor:pointer;color:var(--teks)}
.pr-panel button.aktif{background:var(--aksen);border-color:var(--aksen);color:#fff}
.pr-panel .pr-tab button{min-height:34px;font-size:14px}

.pr-grup .pr-tingkat{display:flex;flex-wrap:wrap;gap:6px}
.pr-kosong{color:var(--redup);padding:10px 2px}
.pr-panel .pr-ruang button{min-height:44px;font-weight:600}
.pr-denah{display:grid;gap:3px;width:100%;max-width:440px;margin:2px auto 10px;background:var(--latar-2,#f1efe9);border:1px solid var(--garis-kuat);border-radius:8px;padding:4px;box-sizing:border-box}
.pr-panel .pr-denah .pr-dk{min-width:0;min-height:0;padding:2px;font-size:12px;font-weight:600;line-height:1.1;overflow:hidden;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center}
.pr-panel .pr-dk.dk-ruang{background:#fff;border:2px solid #6b6256;color:#3d362c}
.pr-panel .pr-dk.dk-rak{background:#fdf3d7;border:2px solid #d4a514;color:#6b4f00}
.pr-panel .pr-dk.dk-area{background:#e6f2ee;border:2px dashed #0f6e56;color:#085041}.pr-panel .pr-dk.dk-sementara{background:#fde8e8;border-color:#c0392b;color:#7a1d14}
.pr-dk.dk-pintu{border:2px dotted #888;color:#666;background:#fff;font-weight:400}
.pr-panel .pr-dk.aktif{background:var(--aksen);border-color:var(--aksen);color:#fff}
.pr-area{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:6px 0 10px}
.pr-area button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:56px;border-style:dashed}
.pr-area button small{color:var(--redup);font-size:12px}.pr-panel .pr-area button.pr-area-sementara{border-color:#c0392b}
.pr-panel .pr-area button.aktif small{color:#fff}

.pr-grid-kepala button.pr-buka{min-height:40px}
.pr-kotak{display:grid;gap:5px;margin:2px 0 10px}

.pr-kotak button{min-width:0;padding:6px 4px}
.pr-kotak .lantai{grid-column:2 / -1;border-top:3px solid var(--garis-kuat);font-size:11px;color:var(--redup);text-align:center}
</style>
<script>
(() => {
  if (window.pilihRak) return;
  const POLA = /^(.+?)[-.](\d+)$/;
  let DENAH = null;
  const denahData = () => {
    if (DENAH === null) { try { DENAH = JSON.parse(document.getElementById('data-denah-rak').textContent); } catch (e) { DENAH = {}; } }
    return DENAH;
  };
  // Denah dari atas (14 Nov 2026): kotak-kotak di petak kolom x baris; tinggi petak = lebar petak.
  function gambarDenah(kolom, kotak, klik, aktif, rapat){
    if (rapat) {
      // Denah lokasi: buang petak kosong di pinggir supaya ruangan tampil sebesar mungkin.
      const x0 = Math.min(...kotak.map(k => k.x)), y0 = Math.min(...kotak.map(k => k.y));
      kotak = kotak.map(k => ({...k, x: k.x - x0, y: k.y - y0}));
      kolom = Math.max(...kotak.map(k => k.x + k.w));
    }
    const baris = Math.max(1, ...kotak.map(k => k.y + k.h));
    const peta = document.createElement('div'); peta.className = 'pr-denah';
    peta.style.gridTemplateColumns = `repeat(${kolom}, 1fr)`; peta.style.gridTemplateRows = `repeat(${baris}, 1fr)`;
    peta.style.aspectRatio = `${kolom} / ${baris}`;
    kotak.forEach(k => {
      const el = document.createElement(k.klik === false ? 'div' : 'button');
      if (el.tagName === 'BUTTON') { el.type = 'button'; el.addEventListener('click', () => klik(k)); }
      el.className = 'pr-dk ' + (k.kelas || '') + (aktif && aktif(k) ? ' aktif' : '');
      el.style.gridColumn = `${k.x + 1} / span ${k.w}`; el.style.gridRow = `${k.y + 1} / span ${k.h}`;
      el.textContent = k.nama;
      peta.append(el);
    });
    return peta;
  }
  const alami = (a, b) => String(a).localeCompare(String(b), 'id', {numeric: true, sensitivity: 'base'});
  let panel = null, latar = null, sasaran = null;

  function opsi(sel){
    const rak = [], lain = [];
    [...sel.options].forEach(o => {
      if (o.dataset.r !== undefined) rak.push({kode: o.value, nama: o.dataset.nama || '', tempat: o.dataset.tempat || '',
        induk: o.dataset.induk || '', baris: +(o.dataset.baris || 0), kolom: +(o.dataset.kolom || 0),
        ruang: o.dataset.ruang || '', ruangUrut: o.dataset.ruangUrut === undefined || o.dataset.ruangUrut === '' ? 9999 : +o.dataset.ruangUrut, jenis: o.dataset.jenis || 'rak', lebar: +(o.dataset.lebar || 1), tinggi: +(o.dataset.tinggi || 1), o});
      else lain.push(o);
    });
    return {rak, lain};
  }

  function label(sel){
    const o = sel.options[sel.selectedIndex];
    if (!o) return '-';
    return o.dataset.r !== undefined ? (o.dataset.label || o.value) : o.textContent.trim();
  }

  function segarkan(sel){
    const t = sel.nextElementSibling;
    if (!t || !t.classList.contains('pr-tombol')) return;
    t.querySelector('.pr-lbl').textContent = label(sel);
    t.disabled = sel.disabled;
  }

  function pasang(sel){
    if (sel.dataset.prSiap) { if (!(sel.nextElementSibling || {}).classList?.contains('pr-tombol')) delete sel.dataset.prSiap; else return; }
    sel.dataset.prSiap = '1';
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'pr-tombol' + (sel.classList.contains('sel') ? ' sel' : '') + (sel.className.match(/\bsh-rak\b/) ? ' sh-rak' : '');
    t.setAttribute('aria-haspopup', 'dialog');
    t.setAttribute('aria-label', sel.getAttribute('aria-label') || 'Pilih rak');
    const w = sel.getBoundingClientRect().width;
    if (w > 0 && !sel.classList.contains('sh-rak')) t.style.width = Math.max(w, 110) + 'px';
    const s = document.createElement('span'); s.className = 'pr-lbl'; t.append(s);
    sel.style.display = 'none';
    sel.after(t);
    segarkan(sel);
    sel.addEventListener('change', () => segarkan(sel));
    // Umpan balik simpan/gagal dari penyimpan .sel ikut tampil di tombol.
    new MutationObserver(() => ['simpan', 'gagal'].forEach(k => t.classList.toggle(k, sel.classList.contains(k))))
      .observe(sel, {attributes: true, attributeFilter: ['class']});
  }

  function tutup(){
    if (panel) panel.remove(); if (latar) latar.remove();
    panel = latar = null;
    if (sasaran) { const t = sasaran.nextElementSibling; sasaran = null; if (t) t.focus(); }
  }

  function pilih(sel, nilai){
    sel.value = nilai;
    tutup();
    sel.dispatchEvent(new Event('change', {bubbles: true}));
    segarkan(sel);
  }

  function buka(sel){
    tutup();
    sasaran = sel;
    const {rak, lain} = opsi(sel);
    const tempatList = [...new Set(rak.map(r => r.tempat))];
    const kini = rak.find(r => r.kode === sel.value);
    let tab = kini ? kini.tempat : (tempatList[0] ?? '');
    let bukaGrid = null;   // rak baris x kolom yang sedang dibuka di panel
    let ruangPilih = kini ? kini.ruang : null;   // ruangan yang sedang dibuka (null = pilih otomatis)
    const sempit = innerWidth < 640;
    panel = document.createElement('div');
    panel.className = 'pr-panel' + (sempit ? ' lembar' : '');
    panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-label', 'Pilih rak');
    // Isi panel digambar ulang saat tab diklik; jangan sampai klik itu dianggap klik di luar panel.
    panel.addEventListener('click', e => e.stopPropagation());
    if (sempit) { latar = document.createElement('div'); latar.className = 'pr-latar'; latar.addEventListener('click', tutup); document.body.append(latar); }

    const cari = document.createElement('input');
    cari.type = 'search'; cari.className = 'pr-cari'; cari.placeholder = 'Cari kode atau nama rak'; cari.autocomplete = 'off';
    const atas = document.createElement('div'); atas.className = 'pr-baris';
    lain.forEach(o => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = o.textContent.trim() || '-';
      if (o.value === sel.value) b.classList.add('aktif');
      b.addEventListener('click', () => pilih(sel, o.value)); atas.append(b);
    });
    const tabs = document.createElement('div'); tabs.className = 'pr-baris pr-tab';
    const tabsRuang = document.createElement('div'); tabsRuang.className = 'pr-baris pr-ruang';
    const peta = document.createElement('div');
    const isi = document.createElement('div');
    panel.append(...(rak.length > 8 ? [cari] : []), ...(lain.length ? [atas] : []), ...(tempatList.length > 1 ? [tabs] : []), peta, tabsRuang, isi);

    function gambarTab(){
      tabs.replaceChildren(...tempatList.map(tp => {
        const b = document.createElement('button'); b.type = 'button';
        b.textContent = (tp || 'Tanpa lokasi') + ' · ' + rak.filter(r => r.tempat === tp).length;
        b.classList.toggle('aktif', tp === tab && !cari.value.trim());
        b.addEventListener('click', () => { tab = tp; bukaGrid = null; ruangPilih = null; cari.value = ''; gambar(); });
        return b;
      }));
    }

    function gambar(){
      gambarTab();
      const q = cari.value.trim().toLowerCase();
      // Ruangan (14 Nov 2026): lokasi -> ruangan -> rak/area. Tanpa ruangan sama sekali = seperti dulu.
      const diTab = rak.filter(r => r.tempat === tab);
      const ruangList = [...new Set(diTab.map(r => r.ruang))];
      const urutRuang = ru => (diTab.find(x => x.ruang === ru) || {}).ruangUrut ?? 9999;
      const pakaiRuang = !q && ruangList.some(Boolean);
      if (pakaiRuang && (ruangPilih === null || !ruangList.includes(ruangPilih))) ruangPilih = ruangList.filter(Boolean)[0] ?? '';
      // Denah lokasi: ruangan yang sudah ditaruh di denah dipilih lewat gambar; sisanya lewat tombol.
      const dl = (denahData() || {})[sel.dataset.lokasi || tab];
      const diDenah = ru => !!(dl && ru && dl.ruang[ru] && dl.ruang[ru].w);
      peta.replaceChildren();
      if (pakaiRuang && ruangList.some(diDenah)) {
        peta.append(gambarDenah(dl.ukuran[0], ruangList.filter(diDenah).map(ru => ({...dl.ruang[ru], nama: ru, ru, kelas: 'dk-ruang'})),
          k => { ruangPilih = k.ru; bukaGrid = null; gambar(); }, k => k.ru === ruangPilih, true));
      }
      tabsRuang.hidden = !pakaiRuang;
      tabsRuang.replaceChildren(...(pakaiRuang ? ruangList.filter(ru => !diDenah(ru)).sort((a, b) => (!a - !b) || (urutRuang(a) - urutRuang(b)) || alami(a, b)).map(ru => {
        const b = document.createElement('button'); b.type = 'button';
        b.textContent = (ru || 'Tanpa ruangan') + ' · ' + new Set(diTab.filter(x => x.ruang === ru).map(x => x.induk || x.kode)).size;
        b.classList.toggle('aktif', ru === ruangPilih);
        b.addEventListener('click', () => { ruangPilih = ru; bukaGrid = null; gambar(); });
        return b;
      }) : []));
      const semuaCocok = q ? rak.filter(r => (r.kode + ' ' + r.nama + ' ' + r.tempat + ' ' + r.ruang).toLowerCase().includes(q))
                           : diTab.filter(r => !pakaiRuang || r.ruang === ruangPilih);
      const area = semuaCocok.filter(r => r.jenis !== 'rak');
      const daftar = semuaCocok.filter(r => r.jenis === 'rak');
      const grup = new Map(), tunggal = [];
      daftar.forEach(r => {
        let dasar, b, k;
        if (r.induk && r.baris) { dasar = r.induk; b = r.baris; k = r.kolom || 1; }
        else { const m = r.kode.match(POLA); if (!m) { tunggal.push(r); return; } dasar = m[1]; b = +m[2]; k = 1; }
        const kunciGrup = (q && tempatList.length > 1 ? r.tempat + '\u0000' : '') + dasar;
        if (!grup.has(kunciGrup)) grup.set(kunciGrup, {kunci: kunciGrup, dasar, tempat: r.tempat, item: []});
        grup.get(kunciGrup).item.push({...r, b, k, lb: r.lebar || 1, tg: r.tinggi || 1});
      });
      // Rak dengan satu kotak saja digabung ke "Rak lain" supaya tidak satu baris per rak.
      [...grup].forEach(([k, g]) => { if (g.item.length === 1) { tunggal.push(g.item[0]); grup.delete(k); } });
      const tombolRak = (x, teks) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = teks;
        b.title = x.kode + (x.nama ? ' · ' + x.nama : ''); b.setAttribute('aria-label', 'Rak ' + x.kode);
        if (x.kode === sel.value) b.classList.add('aktif');
        b.addEventListener('click', () => pilih(sel, x.kode));
        return b;
      };
      const judulGrup = g => {
        const n = document.createElement('div'); n.className = 'pr-nama'; n.textContent = 'Rak ' + g.dasar;
        const namaUnik = [...new Set(g.item.map(x => x.nama).filter(Boolean))];
        const nk = Math.max(...g.item.map(x => x.k + x.lb - 1)), nb = Math.max(...g.item.map(x => x.b + x.tg - 1));
        const sub = [namaUnik.length === 1 ? namaUnik[0] : '', nk > 1 ? `${nb} baris × ${nk} kolom` : '',
                     q && tempatList.length > 1 ? (g.tempat || 'Tanpa lokasi') : ''].filter(Boolean).join(' · ');
        if (sub) { const s2 = document.createElement('small'); s2.textContent = sub; n.append(s2); }
        return n;
      };
      const grids = [...grup.values()].filter(g => g.item.some(x => x.k + x.lb - 1 > 1));
      if (!bukaGrid) {
        bukaGrid = new Set(grids.filter(g => g.item.some(x => x.kode === sel.value)).map(g => g.kunci));
        if (grids.length === 1) bukaGrid.add(grids[0].kunci);
      }
      const baris = [];
      // Denah ruangan: rak (buka gambar kotaknya), area (langsung dipilih), pintu (penunjuk arah).
      const dr = !q && pakaiRuang && dl && dl.ruang[ruangPilih];
      if (dr && dr.blok && dr.blok.length) {
        const kodeArea = new Set(area.map(x => x.kode));
        const jenisArea = Object.fromEntries(area.map(x => [x.kode, x.jenis]));
        const namaArea = Object.fromEntries(area.map(x => [x.kode, x.nama || x.kode]));
        baris.push(gambarDenah(dl.ukuran_ruang[0], dr.blok.map(b => b.t === 'pintu' ? {...b, nama: 'pintu', kelas: 'dk-pintu', klik: false}
          : b.t === 'area' || kodeArea.has(b.id) ? {...b, nama: namaArea[b.id] || b.id, kelas: 'dk-area dk-' + (jenisArea[b.id] || 'lantai')}
          : {...b, nama: 'Rak ' + b.id, kelas: 'dk-rak'}),
          k => {
            if (k.kelas.includes('dk-area')) { pilih(sel, k.id); return; }
            const g = [...grup.values()].find(g => g.dasar === k.id);
            if (g && g.item.some(x => x.k + x.lb - 1 > 1)) { bukaGrid = new Set([g.kunci]); gambar(); }
            setTimeout(() => { const t = [...isi.querySelectorAll('.pr-grid-kepala, .pr-grup')].find(e => e.textContent.startsWith('Rak ' + k.id));
              if (t) t.scrollIntoView({block: 'start', behavior: 'smooth'}); }, 30);
          },
          k => (k.kelas || '').includes('dk-area') ? k.id === sel.value : (rak.find(x => x.kode === sel.value) || {}).induk === k.id));
      }
      if (area.length) {
        const d = document.createElement('div'); d.className = 'pr-area';
        area.sort((a, b) => (a.jenis === 'sementara') - (b.jenis === 'sementara') || alami(a.kode, b.kode)).forEach(x => {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'pr-area-' + x.jenis;
          const n = document.createElement('b'); n.textContent = x.nama || x.kode;
          const k = document.createElement('small'); k.textContent = (x.jenis === 'sementara' ? 'Area sementara' : 'Area lantai')
            + (q && x.ruang ? ' · ' + x.ruang : '');
          b.append(n, k); b.setAttribute('aria-label', (x.jenis === 'sementara' ? 'Area sementara ' : 'Area lantai ') + (x.nama || x.kode));
          if (x.kode === sel.value) b.classList.add('aktif');
          b.addEventListener('click', () => pilih(sel, x.kode)); d.append(b);
        });
        baris.push(d);
      }
      [...grup.values()].sort((a, b) => alami(a.dasar, b.dasar)).forEach(g => {
        const nk = Math.max(...g.item.map(x => x.k + x.lb - 1));
        if (nk === 1) {
          // Rak 1 kolom (bertingkat): satu baris tombol nomor baris, 1 = paling bawah.
          const d = document.createElement('div'); d.className = 'pr-grup';
          const tk = document.createElement('div'); tk.className = 'pr-tingkat';
          g.item.sort((a, b) => a.b - b.b).forEach(x => tk.append(tombolRak(x, String(x.b))));
          d.append(judulGrup(g), tk); baris.push(d);
          return;
        }
        // Rak baris x kolom: gambar tampak depan (baris teratas di atas, lantai di bawah), dibuka per rak.
        const kepala = document.createElement('div'); kepala.className = 'pr-grid-kepala';
        const buka = q || bukaGrid.has(g.kunci);
        const t = document.createElement('button'); t.type = 'button'; t.className = 'pr-buka';
        t.textContent = buka ? 'Tutup' : 'Pilih kotak ▸'; t.setAttribute('aria-expanded', buka);
        t.addEventListener('click', () => { bukaGrid.has(g.kunci) ? bukaGrid.delete(g.kunci) : bukaGrid.add(g.kunci); gambar(); });
        kepala.append(judulGrup(g), t); baris.push(kepala);
        if (!buka) return;
        const nb = Math.max(...g.item.map(x => x.b + x.tg - 1));
        // Letak eksplisit (CSS grid) supaya kotak gabungan (lebar/tinggi > 1) tampil seperti aslinya.
        const kotak = document.createElement('div'); kotak.className = 'pr-kotak';
        kotak.style.gridTemplateColumns = `auto repeat(${nk}, minmax(44px, 1fr))`;
        const sel2 = [];
        const taruh = (el, baris, kolom, tg = 1, lb = 1) => { el.style.gridRow = `${baris} / span ${tg}`; el.style.gridColumn = `${kolom} / span ${lb}`; sel2.push(el); };
        for (let k = 1; k <= nk; k++) { const h = document.createElement('div'); h.className = 'sb'; h.textContent = 'K' + k; taruh(h, 1, k + 1); }
        const tertutup = new Set();
        g.item.forEach(x => {
          for (let b = x.b; b < x.b + x.tg; b++) for (let k = x.k; k < x.k + x.lb; k++) tertutup.add(b + ':' + k);
          const teks = x.tg > 1 || x.lb > 1 ? `${x.b}-${x.k} ▭` : `${x.b}-${x.k}`;
          taruh(tombolRak(x, teks), nb - (x.b + x.tg - 1) + 2, x.k + 1, x.tg, x.lb);
        });
        for (let b = nb; b >= 1; b--) {
          const sb = document.createElement('div'); sb.className = 'sb'; sb.textContent = 'B' + b; taruh(sb, nb - b + 2, 1);
          for (let k = 1; k <= nk; k++) if (!tertutup.has(b + ':' + k)) taruh(document.createElement('div'), nb - b + 2, k + 1);
        }
        const kosong = document.createElement('div'); kosong.className = 'sb'; kosong.style.gridRow = String(nb + 2);
        const lantai = document.createElement('div'); lantai.className = 'lantai'; lantai.textContent = 'lantai'; lantai.style.gridRow = String(nb + 2);
        kotak.append(...sel2, kosong, lantai); baris.push(kotak);
      });
      if (tunggal.length) {
        const d = document.createElement('div'); d.className = 'pr-grup';
        const n = document.createElement('div'); n.className = 'pr-nama'; n.textContent = grup.size ? 'Rak lain' : 'Rak';
        const tk = document.createElement('div'); tk.className = 'pr-tingkat';
        tunggal.sort((a, b) => alami(a.kode, b.kode)).forEach(x => {
          const b = document.createElement('button'); b.type = 'button'; b.textContent = x.kode; b.title = x.nama;
          if (x.kode === sel.value) b.classList.add('aktif');
          b.addEventListener('click', () => pilih(sel, x.kode)); tk.append(b);
        });
        d.append(n, tk); baris.push(d);
      }
      if (!baris.length) { const k = document.createElement('div'); k.className = 'pr-kosong'; k.textContent = q ? 'Tidak ada rak yang cocok.' : 'Belum ada rak di sini.'; baris.push(k); }
      isi.replaceChildren(...baris);
      posisikan();
    }
    cari.addEventListener('input', gambar);
    cari.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const tombol = isi.querySelectorAll('.pr-tingkat button, .pr-kotak button');
      if (tombol.length === 1) tombol[0].click();
    });
    gambar();
    document.body.append(panel);
    posisikan();
    // Di tablet keyboard tidak dibuka otomatis; di PC langsung bisa mengetik.
    if (!sempit && rak.length > 8 && !matchMedia('(pointer: coarse)').matches) cari.focus();
  }

  /*
   * Letak panel mengikuti layar yang terlihat (visualViewport). Saat keyboard tablet muncul, layar yang
   * terlihat mengecil: lembar bawah naik di atas keyboard dan panel melayang digeser supaya tetap terlihat.
   * Dulu panel ditutup saat ukuran layar berubah, jadi menyentuh kotak cari (keyboard muncul) menutup
   * panel, dan di posisi tegak lembar tertutup keyboard (QA tablet 14 Nov 2026).
   */
  function posisikan(){
    if (!panel || !sasaran) return;
    const vv = window.visualViewport;
    const vh = vv ? vv.height : innerHeight, vAtas = vv ? vv.offsetTop : 0;
    if (panel.classList.contains('lembar')) {
      panel.style.bottom = Math.max(0, Math.round(innerHeight - vh - vAtas)) + 'px';
      panel.style.maxHeight = Math.round(vh * 0.85) + 'px';
      return;
    }
    const tombol = sasaran.nextElementSibling;
    if (!tombol) return;
    const t = tombol.getBoundingClientRect();
    panel.style.maxHeight = '';
    const lebar = panel.offsetWidth, bawah = vAtas + vh;
    let tinggi = panel.offsetHeight;
    if (tinggi > vh - 16) { panel.style.maxHeight = Math.max(160, vh - 16) + 'px'; tinggi = panel.offsetHeight; }
    let x = t.left;
    if (x + lebar > innerWidth - 8) x = Math.max(8, innerWidth - lebar - 8);
    let y = t.bottom + 4;
    if (y + tinggi > bawah - 8) {
      y = (t.top - tinggi - 4 >= vAtas + 8) ? t.top - tinggi - 4 : Math.max(vAtas + 8, bawah - 8 - tinggi);
    }
    panel.style.left = (x + scrollX) + 'px'; panel.style.top = (y + scrollY) + 'px';
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('.pr-tombol');
    if (t) { const sel = t.previousElementSibling; if (sel && sel.tagName === 'SELECT') { e.preventDefault(); panel && sasaran === sel ? tutup() : buka(sel); } return; }
    if (panel && !panel.contains(e.target)) tutup();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel) { e.stopPropagation(); tutup(); } }, true);
  addEventListener('resize', posisikan);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', posisikan);
    visualViewport.addEventListener('scroll', posisikan);
  }

  const semua = akar => (akar.querySelectorAll ? akar : document).querySelectorAll('select[data-pilih-rak]').forEach(pasang);
  window.pilihRak = {segarkan, pasang, semua};
  const mulai = () => {
    semua(document);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
      if (n.nodeType !== 1) return;
      if (n.matches('select[data-pilih-rak]')) pasang(n); else semua(n);
    }))).observe(document.body, {childList: true, subtree: true});
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', mulai) : mulai();
})();
</script>
