{% load master_tags %}{# Isian per baris untuk membagi ongkir: berat (cara berat) / ongkir baris (cara manual). #}
<td class="angka kol-berat"><input class="kotak" style="width:80px" name="berat_{{ b.id }}" inputmode="decimal" placeholder="kg" value="{% if b.berat is not None %}{{ b.berat|floatformat:'-3' }}{% elif b.varian.berat is not None %}{{ b.varian.berat|floatformat:'-3' }}{% endif %}" title="Berat kira-kira per {% if b|berkoma %}{{ b|nama_satuan }}{% else %}satuan{% endif %} (kg); diingat untuk pembelian berikutnya"></td>
<td class="angka kol-manual"><input class="kotak" style="width:110px" name="ongkir_{{ b.id }}" inputmode="numeric" placeholder="Rp" value="{% if b.ongkir_isi is not None %}{{ b.ongkir_isi|ribuan }}{% endif %}" title="Ongkir untuk baris ini (total, bukan per satuan)"></td>
