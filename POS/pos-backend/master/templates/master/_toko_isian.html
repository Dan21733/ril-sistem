<div class="kisi">
  <div><label>Kode singkat</label><input type="text" name="kode" value="{{ t.kode }}" required maxlength="10" placeholder="mis. DB, HM"></div>
  <div><label>Nama toko</label><input type="text" name="nama" value="{{ t.nama }}" required></div>
  <div><label>Atas nama (pemilik / NPWP)</label><input type="text" name="atas_nama" value="{{ t.atas_nama }}"></div>
  <div><label>Telepon</label><input type="text" name="telepon" value="{{ t.telepon }}"></div>
  <div><label>Sisa minimal kas saat tutup</label><input type="text" name="kas_sisa_minimal" inputmode="numeric" value="{% if t %}{{ t.kas_sisa_minimal }}{% else %}400000{% endif %}"></div>
  <div><label>Angka kas di tablet kasir</label><select name="kas_tampil_kasir"><option value="0">Disembunyikan (pemilik yang pegang kas)</option><option value="1" {% if t.kas_tampil_kasir %}selected{% endif %}>Ditampilkan (toko dipegang karyawan)</option></select></div>
  <div><label>Warna penanda (master &amp; HP)</label><input type="color" name="warna" value="{% if t %}{{ t.warna_tampil }}{% else %}#2F5D8A{% endif %}" style="height:42px;padding:2px"></div>
  <div><label>Status pajak</label><select name="pkp"><option value="0">Belum PKP</option><option value="1" {% if t.pkp %}selected{% endif %}>PKP</option></select></div>
  <div><label>PKP sejak (kalau PKP)</label><input type="date" name="pkp_mulai" value="{{ t.pkp_mulai|date:'Y-m-d' }}"></div>
</div>
<div class="kisi" style="margin-top:12px">
  <div><label>Jenis</label><select name="titip_di">
    <option value="">Toko sendiri</option>
    {% for p in pilihan_titip %}{% if not t or p.id != t.id %}<option value="{{ p.id }}" {% if t.titip_di_id == p.id %}selected{% endif %}>Titipan, dijual di kasir {{ p.nama }}</option>{% endif %}{% endfor %}
  </select>
  <div class="redup kecil" style="margin-top:4px">Titipan: barang milik pihak lain yang dijual kasir toko ini. Nota, laporan, dan setorannya terpisah.</div></div>
</div>
<div style="margin-top:12px"><label>Alamat</label><input type="text" name="alamat" value="{{ t.alamat }}"></div>
