{# Pilihan periode: tombol besar, satu ketukan. "Pilih tanggal" membuka kalender (rentang). #}
<nav class="periode" aria-label="Periode">
  {% for k, l in periode %}<a href="?p={{ k }}" class="{% if p == k %}aktif{% endif %}">{{ l }}</a>{% endfor %}
  <button type="button" class="{% if p == 'tanggal' %}aktif{% endif %}" data-pilih-periode data-awal="{{ awal|date:'Y-m-d' }}" data-akhir="{{ akhir|date:'Y-m-d' }}" data-maks="{{ hari_ini|date:'Y-m-d' }}">📅 {% if p == 'tanggal' %}{{ judul_periode }} · ganti{% else %}Pilih tanggal{% endif %}</button>
</nav>
