{# Pil tanggal + avatar untuk bilah atas beranda, dan lembar pilihan tanggal. #}
<span style="display:inline-flex;gap:8px;align-items:center">
  <button type="button" class="pil tanggal" data-buka-lembar="lembar-tanggal" aria-label="Periode: {{ judul_periode }}. Ganti">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
    <span class="pil-nama">{{ judul_pendek|default:judul_periode }}</span></button>
  <a href="{% url 'hp:setelan' %}" aria-label="Setelan akun" class="avatar">{{ request.user.first_name|default:request.user.username|slice:":1"|upper }}</a>
</span>
